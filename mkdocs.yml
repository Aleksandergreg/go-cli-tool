site_name: OpsQuest
site_url: https://aleksandergreg.github.io/go-cli-tool/
site_description: Learn Linux and container operations through safe, story-driven terminal missions.
repo_url: https://github.com/Aleksandergreg/go-cli-tool
repo_name: Aleksandergreg/go-cli-tool
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright © 2026 OpsQuest contributors

validation:
  invalid_links: true
  invalid_link_anchors: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: README.md
  - Play OpsQuest:
      - Overview: play/README.md
      - Quick start: play/quick-start.md
      - How missions work: play/how-missions-work.md
      - Controls and commands: play/controls-and-commands.md
      - Linux worlds: play/linux-worlds.md
      - Docker Foundations: play/docker-foundations.md
  - Game and learning:
      - Overview: game/README.md
      - Learning philosophy: game/learning-philosophy.md
      - Curriculum and mission map: game/curriculum.md
      - Outcome-based mission design: game/mission-design.md
      - Progression and rewards: game/progression.md
  - Technical:
      - Overview: technical/README.md
      - Architecture: technical/architecture.md
      - Sandbox and safety: technical/sandbox-and-safety.md
      - Mission content model: technical/mission-content.md
      - Profiles and compatibility: technical/profiles-and-compatibility.md
      - Contributing and quality gates: technical/contributing.md
  - Project:
      - Roadmap: roadmap/README.md
      - Hosted documentation: roadmap/hosted-documentation.md
      - Docker Foundations roadmap: roadmap/docker-foundations.md
      - CI/CD improvements: roadmap/ci-cd.md
      - Delivery archive: history/README.md
      - Changelog: https://github.com/Aleksandergreg/go-cli-tool/blob/main/CHANGELOG.md
      - Releases: https://github.com/Aleksandergreg/go-cli-tool/releases

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
