<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">OpsQuest system landscape</title>
  <desc id="desc">Conceptual overview showing the player interacting with the OpsQuest process, its catalog, game session, environment factory, in-memory sandbox, profile store, and optional Docker adapter.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#475569"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <style>
      .title{font:700 36px Inter,system-ui,sans-serif;fill:#0f172a}.subtitle{font:400 17px Inter,system-ui,sans-serif;fill:#475569}
      .zone{font:700 13px Inter,system-ui,sans-serif;letter-spacing:.12em}.head{font:700 18px Inter,system-ui,sans-serif}.body{font:400 14px Inter,system-ui,sans-serif}.small{font:600 12px Inter,system-ui,sans-serif}
      .edge{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#7c3aed;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="55" y="58" class="title">OpsQuest at a glance</text>
  <text x="55" y="88" class="subtitle">One CLI process coordinates declarative content, an isolated attempt, and durable learning progress.</text>

  <rect x="35" y="125" width="210" height="675" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="58" y="157" class="zone" fill="#9f1239">PLAYER-CONTROLLED</text>
  <g filter="url(#shadow)">
    <rect x="65" y="340" width="150" height="125" rx="22" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
    <circle cx="140" cy="375" r="17" fill="#be123c"/>
    <path d="M105 427 C112 390 168 390 175 427" fill="#be123c"/>
    <text x="140" y="449" text-anchor="middle" class="head" fill="#881337">Player</text>
  </g>
  <text x="140" y="500" text-anchor="middle" class="body" fill="#9f1239">commands</text>
  <text x="140" y="521" text-anchor="middle" class="body" fill="#9f1239">navigation</text>

  <rect x="285" y="125" width="860" height="675" rx="28" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="315" y="158" class="zone" fill="#1d4ed8">TRUSTED OPSQUEST PROCESS</text>

  <path class="edge" d="M215 403 H345"/><text x="278" y="392" text-anchor="middle" class="small" fill="#475569">terminal I/O</text>
  <path class="edge" d="M475 285 V360"/>
  <path class="edge" d="M625 235 H755"/>
  <path class="edge" d="M625 262 C690 290 705 360 755 390"/>
  <path class="edge" d="M475 478 V555"/>
  <path class="edge" d="M625 615 H755"/>
  <path class="edge" d="M625 645 C690 690 700 710 755 720"/>
  <path class="edge" d="M885 555 V485 C885 455 780 460 625 445"/>
  <path class="edge" d="M885 685 V485 C885 455 780 450 625 430"/>

  <g filter="url(#shadow)">
    <rect x="345" y="190" width="280" height="95" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="485" y="226" text-anchor="middle" class="head" fill="#172554">CLI and routes</text>
    <text x="485" y="252" text-anchor="middle" class="body" fill="#1e3a8a">select · present · navigate</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="345" y="360" width="280" height="118" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="485" y="398" text-anchor="middle" class="head" fill="#172554">Game session</text>
    <text x="485" y="425" text-anchor="middle" class="body" fill="#1e3a8a">attempt loop · controls</text>
    <text x="485" y="448" text-anchor="middle" class="body" fill="#1e3a8a">outcome evaluation · rewards</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="345" y="555" width="280" height="118" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="485" y="594" text-anchor="middle" class="head" fill="#78350f">Environment factory</text>
    <text x="485" y="620" text-anchor="middle" class="body" fill="#92400e">simulated by default</text>
    <text x="485" y="643" text-anchor="middle" class="body" fill="#92400e">Docker when mission requests it</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="755" y="190" width="260" height="95" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="885" y="226" text-anchor="middle" class="head" fill="#14532d">Mission catalog</text>
    <text x="885" y="252" text-anchor="middle" class="body" fill="#166534">strict embedded JSON</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="755" y="360" width="260" height="95" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="885" y="396" text-anchor="middle" class="head" fill="#14532d">Profile store</text>
    <text x="885" y="422" text-anchor="middle" class="body" fill="#166534">versioned · atomic save</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="755" y="525" width="260" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="885" y="564" text-anchor="middle" class="head" fill="#78350f">In-memory sandbox</text>
    <text x="885" y="591" text-anchor="middle" class="body" fill="#92400e">virtual files · env · PIDs</text>
    <text x="885" y="614" text-anchor="middle" class="body" fill="#92400e">no host command execution</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="755" y="685" width="260" height="82" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="885" y="719" text-anchor="middle" class="head" fill="#4c1d95">Docker adapter</text>
    <text x="885" y="744" text-anchor="middle" class="body" fill="#5b21b6">typed actions · exact ownership</text>
  </g>

  <rect x="1185" y="125" width="280" height="675" rx="24" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1212" y="157" class="zone" fill="#6d28d9">HOST FACILITIES</text>
  <path class="edge" d="M1015 405 H1218"/><text x="1115" y="393" text-anchor="middle" class="small" fill="#475569">atomic file I/O</text>
  <path class="dashed" d="M1015 726 H1218"/><text x="1115" y="714" text-anchor="middle" class="small" fill="#6d28d9">fixed argv only</text>

  <g filter="url(#shadow)">
    <rect x="1218" y="330" width="214" height="145" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M1260 365 h115 l25 25 v50 h-140z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M1375 365 v25 h25" fill="none" stroke="#16a34a" stroke-width="2"/>
    <text x="1325" y="427" text-anchor="middle" class="head" fill="#14532d">profile.json</text>
    <text x="1325" y="454" text-anchor="middle" class="body" fill="#166534">durable progress only</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1218" y="645" width="214" height="145" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="1250" y="680" width="150" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="1270" cy="706" r="7" fill="#7c3aed"/><circle cx="1292" cy="706" r="7" fill="#7c3aed"/>
    <text x="1325" y="760" text-anchor="middle" class="head" fill="#4c1d95">Docker daemon</text>
    <text x="1325" y="781" text-anchor="middle" class="body" fill="#5b21b6">optional</text>
  </g>

  <text x="55" y="857" class="body" fill="#64748b">Linux attempt state dies with the attempt. Profile progress is durable. Docker resources are disposable and label-scoped.</text>
  <text x="1445" y="857" text-anchor="end" class="body" fill="#64748b">Editable source: system-landscape.excalidraw</text>
</svg>
