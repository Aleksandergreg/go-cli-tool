  <title id="title">Teaching-shell command execution pipeline</title>
  <desc id="desc">Flow from bounded player input through command-list splitting, per-pipeline lexing, parsing, virtual expansion, preflight, Go command dispatch, virtual state, redirection, exit status, a loop for the next pipeline in a list, execution metadata, and mission outcome evaluation.</desc>
