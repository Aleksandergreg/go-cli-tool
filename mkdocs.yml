site_name: OpsQuest
site_url: https://aleksandergreg.github.io/go-cli-tool/
site_description: Learn Linux and container operations through safe, story-driven terminal missions.
repo_url: https://github.com/Aleksandergreg/go-cli-tool
repo_name: Aleksandergreg/go-cli-tool
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright © 2026 OpsQuest contributors

validation:
  invalid_links: true
  invalid_link_anchors: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: README.md
  - Play:
      - play/README.md
      - Quick start: play/quick-start.md
      - Missions, hints, and progress: play/missions-and-progress.md
      - Controls and commands: play/controls-and-commands.md
      - Mission map: play/mission-map.md
      - Docker Foundations: play/docker-foundations.md
  - How OpsQuest works:
      - game/README.md
      - Learning philosophy: game/learning-philosophy.md
      - Architecture: technical/architecture.md
      - Sandbox and safety: technical/sandbox-and-safety.md
  - Contribute:
      - technical/README.md
      - Contributing and quality gates: technical/contributing.md
      - Mission authoring: technical/mission-authoring.md
      - Profiles and compatibility: technical/profiles-and-compatibility.md
  - Project:
      - roadmap/README.md
      - Changelog: https://github.com/Aleksandergreg/go-cli-tool/blob/main/CHANGELOG.md
      - Releases: https://github.com/Aleksandergreg/go-cli-tool/releases

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
