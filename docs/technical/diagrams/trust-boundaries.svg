<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">OpsQuest trust boundaries</title>
  <desc id="desc">Security overview separating player-controlled input, trusted OpsQuest parsing and adapters, in-memory mission state, profile persistence, and the optional Docker daemon.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#475569"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <style>
      .title{font:700 36px Inter,system-ui,sans-serif;fill:#0f172a}.subtitle{font:400 17px Inter,system-ui,sans-serif;fill:#475569}
      .zone{font:700 13px Inter,system-ui,sans-serif;letter-spacing:.12em}.head{font:700 18px Inter,system-ui,sans-serif}.body{font:400 14px Inter,system-ui,sans-serif}.small{font:600 12px Inter,system-ui,sans-serif}
      .edge{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.external{fill:none;stroke:#7c3aed;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#arrowPurple)}.blocked{fill:none;stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="55" y="58" class="title">Trust boundaries and permitted flows</text>
  <text x="55" y="88" class="subtitle">Raw player text enters one trusted router; only constrained adapters can reach host facilities.</text>

  <rect x="35" y="125" width="220" height="680" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="62" y="158" class="zone" fill="#9f1239">UNTRUSTED</text>
  <g filter="url(#shadow)"><rect x="70" y="250" width="150" height="120" rx="20" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="145" y="292" text-anchor="middle" class="head" fill="#881337">Player</text><text x="145" y="320" text-anchor="middle" class="body" fill="#9f1239">command text</text><text x="145" y="343" text-anchor="middle" class="body" fill="#9f1239">aliases and flags</text></g>
  <rect x="70" y="425" width="150" height="92" rx="16" fill="#ffffff" stroke="#fb7185"/><text x="145" y="458" text-anchor="middle" class="small" fill="#9f1239">CAN CHOOSE</text><text x="145" y="483" text-anchor="middle" class="body" fill="#9f1239">supported syntax</text><text x="145" y="504" text-anchor="middle" class="body" fill="#9f1239">virtual names</text>

  <rect x="290" y="125" width="820" height="680" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="320" y="158" class="zone" fill="#1d4ed8">TRUSTED OPSQUEST PROCESS</text>
  <path class="edge" d="M220 310 H445"/><text x="330" y="298" text-anchor="middle" class="small" fill="#475569">only entry</text>
  <g filter="url(#shadow)"><rect x="445" y="210" width="500" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="695" y="249" text-anchor="middle" class="head" fill="#172554">Session control and environment routing</text><text x="695" y="277" text-anchor="middle" class="body" fill="#1e3a8a">navigation is intercepted · attempt commands go to the selected environment</text></g>

  <text x="355" y="358" class="zone" fill="#166534">SIMULATED LINUX PATH</text>
  <path class="edge" d="M570 310 C520 330 500 350 500 385"/>
  <g filter="url(#shadow)"><rect x="350" y="385" width="300" height="115" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="500" y="424" text-anchor="middle" class="head" fill="#14532d">Go teaching shell</text><text x="500" y="451" text-anchor="middle" class="body" fill="#166534">lex · parse · expand · dispatch</text><text x="500" y="474" text-anchor="middle" class="body" fill="#166534">closed command switch</text></g>
  <path class="edge" d="M500 500 V565"/>
  <g filter="url(#shadow)"><rect x="350" y="565" width="300" height="125" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="500" y="605" text-anchor="middle" class="head" fill="#14532d">Attempt-local virtual state</text><text x="500" y="633" text-anchor="middle" class="body" fill="#166534">filesystem · environment · PIDs</text><text x="500" y="656" text-anchor="middle" class="body" fill="#166534">archives · history · editor file</text></g>
  <rect x="365" y="715" width="270" height="50" rx="25" fill="#dcfce7"/><text x="500" y="746" text-anchor="middle" class="small" fill="#166534">NO HOST FILESYSTEM MAPPING</text>

  <text x="735" y="358" class="zone" fill="#6d28d9">OPTIONAL DOCKER PATH</text>
  <path class="external" d="M820 310 C865 330 880 350 880 385"/>
  <g filter="url(#shadow)"><rect x="730" y="385" width="300" height="115" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="880" y="424" text-anchor="middle" class="head" fill="#4c1d95">Typed Docker parser</text><text x="880" y="451" text-anchor="middle" class="body" fill="#5b21b6">list · start · restart · inspect</text><text x="880" y="474" text-anchor="middle" class="body" fill="#5b21b6">validated logical alias only</text></g>
  <path class="external" d="M880 500 V565"/>
  <g filter="url(#shadow)"><rect x="730" y="565" width="300" height="125" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="880" y="605" text-anchor="middle" class="head" fill="#4c1d95">Ownership adapter</text><text x="880" y="633" text-anchor="middle" class="body" fill="#5b21b6">logical alias → tracked exact ID</text><text x="880" y="656" text-anchor="middle" class="body" fill="#5b21b6">fixed argv · labels · cleanup</text></g>
  <rect x="745" y="715" width="270" height="50" rx="25" fill="#ede9fe"/><text x="880" y="746" text-anchor="middle" class="small" fill="#5b21b6">NO RAW COMMAND PASSTHROUGH</text>

  <rect x="1145" y="125" width="320" height="680" rx="24" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1175" y="158" class="zone" fill="#6d28d9">HOST / EXTERNAL</text>
  <path class="external" d="M1030 625 H1200"/><text x="1115" y="613" text-anchor="middle" class="small" fill="#6d28d9">constructed argv</text>
  <g filter="url(#shadow)"><rect x="1200" y="540" width="210" height="150" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><rect x="1240" y="575" width="130" height="45" rx="8" fill="#ede9fe"/><text x="1305" y="648" text-anchor="middle" class="head" fill="#4c1d95">Docker daemon</text><text x="1305" y="674" text-anchor="middle" class="body" fill="#5b21b6">labeled fixtures only</text></g>

  <g filter="url(#shadow)"><rect x="1200" y="255" width="210" height="150" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><path d="M1245 288 h95 l25 25 v52 h-120z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1305" y="385" text-anchor="middle" class="head" fill="#14532d">profile.json</text></g>
  <path class="edge" d="M945 260 C1060 240 1110 300 1200 325"/>
  <text x="1082" y="275" text-anchor="middle" class="small" fill="#475569">Store methods only</text>

  <path class="blocked" d="M220 280 C650 120 1040 175 1200 285"/>
  <line x1="1100" y1="221" x2="1130" y2="251" stroke="#dc2626" stroke-width="4"/><line x1="1130" y1="221" x2="1100" y2="251" stroke="#dc2626" stroke-width="4"/>
  <text x="965" y="204" class="small" fill="#b91c1c">blocked: player-selected host path</text>
  <path class="blocked" d="M220 345 C590 790 1010 800 1200 665"/>
  <line x1="1092" y1="706" x2="1122" y2="736" stroke="#dc2626" stroke-width="4"/><line x1="1122" y1="706" x2="1092" y2="736" stroke="#dc2626" stroke-width="4"/>
  <text x="930" y="788" class="small" fill="#b91c1c">blocked: raw Docker argv or shell</text>

  <text x="55" y="855" class="body" fill="#64748b">Red dashed paths are intentionally impossible through public gameplay input.</text>
  <text x="1445" y="855" text-anchor="end" class="body" fill="#64748b">Editable source: trust-boundaries.excalidraw</text>
</svg>
